# Fetches fresh Yahoo Finance bars, reruns the backtest, and publishes the site to the gh-pages branch.
name: Update data and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start from the last published bars (fallback if a fetch fails)
        run: |
          git fetch --depth 1 origin gh-pages && git checkout FETCH_HEAD -- data/bars || echo "No previous gh-pages data"

      - name: Fetch bars
        run: node scripts/fetch-data.js 10y

      - name: Run backtest
        run: node scripts/backtest.js 10y 5

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html engine.js BACKTEST.md _site/
          cp -r data/. _site/data/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}, data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
